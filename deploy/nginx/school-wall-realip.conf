# 从 Cloudflare Tunnel 还原真实客户端 IP。
# 安装到 /etc/nginx/snippets/school-wall-realip.conf，在 server 块顶部 include。
#
# 为什么必须有这个：
#   cloudflared 跑在本机，隧道过来的请求在 nginx 眼里全部来自 127.0.0.1。
#   而 limit_req_zone / limit_conn_zone 用的是 $binary_remote_addr ——
#   不还原来源的话，全公网访客会被算进同一个限流桶：正常流量互相挤爆，
#   真正的攻击者反而和所有人共享额度。proxy 层往后端传的 X-Forwarded-For
#   同样会恒为 127.0.0.1，后端拿不到任何可用的来源信息。
#
# 为什么只信 127.0.0.1：
#   set_real_ip_from 声明的是「哪些来源的 CF-Connecting-IP 可以采信」。
#   隧道 connector 与 nginx 同机，来源只可能是回环；局域网直连（192.168.31.x）
#   不在信任列表里，因此外部无法通过伪造 CF-Connecting-IP 绕过限流或伪装 IP。
#   若将来改成不走隧道、直接暴露给 Cloudflare 边缘节点，这里必须换成
#   Cloudflare 官方 IP 段（https://www.cloudflare.com/ips/），而不是留着回环。
set_real_ip_from 127.0.0.1;
set_real_ip_from ::1;
real_ip_header   CF-Connecting-IP;
# 不做递归解析：CF-Connecting-IP 只有一个值，递归只会带来歧义
real_ip_recursive off;
