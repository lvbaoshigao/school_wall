# 转发给后端时统一带上的头。被 school-wall.conf 里每个 proxy_pass 引用。
# 安装到 /etc/nginx/snippets/school-wall-proxy.conf

proxy_http_version 1.1;
proxy_set_header Connection "";          # 配合 upstream keepalive 复用连接

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;

# 用 $sw_fwd_proto 而不是 $scheme：TLS 是在 Cloudflare 边缘终结的，
# cloudflared 以明文 HTTP 回源，所以 $scheme 恒为 http。直接写 $scheme 会把
# cloudflared 带来的 X-Forwarded-Proto: https 覆盖掉，后端的 req.secure 判断随之失效，
# 运行看板那张 sw_dash 票据就永远拿不到 Secure 属性。
# $sw_fwd_proto 定义在 school-wall.conf 的 map 里：有上游声明就沿用，没有才回退 $scheme。
proxy_set_header X-Forwarded-Proto $sw_fwd_proto;

# 注意这里用 $remote_addr 而不是 $proxy_add_x_forwarded_for。
# 后者会把客户端自己发来的 X-Forwarded-For 原样接在前面，而后端取的是首项 ——
# 于是任何人都能自带一个伪造的 XFF，为每个请求换一个「IP」，
# 按 IP 的限流直接失效。这里无条件覆盖，只写我们自己观测到的对端地址。
proxy_set_header X-Forwarded-For   $remote_addr;

# 同理，清掉客户端可能伪造的 Cloudflare 头。本机没有走 CF 回源，
# 但后端的 clientIp() 会优先信任 CF-Connecting-IP。
proxy_set_header CF-Connecting-IP  "";
proxy_set_header True-Client-IP    "";

proxy_connect_timeout 5s;
proxy_send_timeout    60s;
proxy_read_timeout    60s;

# 先把请求体在 nginx 收全再转给 node。慢速上传的等待时间由 nginx 扛，
# node 那边看到的是一次快速完整的请求，不会被拖住 worker。
proxy_request_buffering on;
proxy_buffering on;
proxy_buffers 8 16k;
proxy_buffer_size 16k;
