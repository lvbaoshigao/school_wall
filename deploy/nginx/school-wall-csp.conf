# 内容安全策略。只 include 到前端页面相关的 location，**不要**给 /dashboard 用 ——
# 那个页面是后端拼出来的 HTML，按钮用的是内联 onclick，
# script-src 'self' 会直接把它的交互打死。
#
# 安装到 /etc/nginx/snippets/school-wall-csp.conf
#
# 各项说明：
#   script-src 'self'      构建产物全是 /assets/ 下的外部文件，index.html 里没有内联脚本
#   style-src  'unsafe-inline'
#                          Vue 的 :style 绑定会生成行内 style 属性（如帖子列表的 --i 序号），
#                          去掉这条列表动画和若干组件的行内样式会失效
#   img-src    https:      首页壁纸取自 bingw.jasonzeng.dev；data: 供内联的 base64 预览图
#   object-src 'none'      站内不需要 <object>/<embed>
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
