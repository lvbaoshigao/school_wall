# 静态资源/页面与部分代理 location 的通用安全响应头。
# /uploads/ 保留应用返回的更严格私密响应策略，不 include 本片段。
# 安装到 /etc/nginx/snippets/school-wall-headers.conf
#
# 为什么不写在 server 级：nginx 的 add_header 不是叠加而是「就近覆盖」——
# 只要某个 location 自己写了任意一条 add_header，server 级的所有 add_header
# 对它就全部失效。静态产物与入口页需要各自的 Cache-Control，
# 所以这些 location 显式 include 安全头，抽成 snippet 避免漏掉。

add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options SAMEORIGIN always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Cross-Origin-Opener-Policy same-origin always;
