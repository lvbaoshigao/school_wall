# 安全响应头。被 school-wall.conf 里每个 location 显式 include。
# 安装到 /etc/nginx/snippets/school-wall-headers.conf
#
# 为什么不写在 server 级：nginx 的 add_header 不是叠加而是「就近覆盖」——
# 只要某个 location 自己写了任意一条 add_header，server 级的所有 add_header
# 对它就全部失效。本站几乎每个 location 都要设 Cache-Control，
# 于是安全头必须在每个 location 里重发一遍，抽成 snippet 避免漏掉。

add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options SAMEORIGIN always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Cross-Origin-Opener-Policy same-origin always;
