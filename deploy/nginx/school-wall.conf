# 校园墙 —— nginx 反向代理
# 安装到 /etc/nginx/sites-available/school-wall 并软链到 sites-enabled/
#
# 对外只开 11451；后端 node 收在 127.0.0.1:3000，外部无法直连。
# 这一层承担应用层做不到或做起来代价太高的事：连接数上限、慢速连接超时、
# 请求体在进入 node 之前就被拒、静态文件不经事件循环。

# ---- 限流分桶 ----
# 本文件被 include 进 http {}，所以 zone 定义放在这里就是 http 级的。
# 10m 的共享内存约能存 16 万个 IP。
limit_req_zone  $binary_remote_addr zone=sw_read:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=sw_conn:10m;

# 写操作单独一个更严的桶。key 为空字符串时 nginx 不计数，
# 于是这个 map 让只读请求完全不进这个桶，无需为每个方法拆 location。
map $request_method $sw_write_key {
    default "";
    POST    $binary_remote_addr;
    PUT     $binary_remote_addr;
    PATCH   $binary_remote_addr;
    DELETE  $binary_remote_addr;
}
limit_req_zone $sw_write_key zone=sw_write:10m rate=2r/s;

# 回源协议。走 Cloudflare 隧道时 TLS 在边缘终结，cloudflared 用明文 HTTP 回源，
# nginx 自己的 $scheme 因此恒为 http；真实协议只在 cloudflared 带来的
# X-Forwarded-Proto 里。有上游声明就沿用，没有（局域网直连）才回退 $scheme。
# 只认 https/http 两个字面值，其它一律当 $scheme，避免把任意字符串透传给后端。
map $http_x_forwarded_proto $sw_fwd_proto {
    default $scheme;
    https   https;
    http    http;
}

upstream school_wall_backend {
    server 127.0.0.1:3000;
    # 复用到后端的连接，省掉每个请求一次 TCP 握手。
    # keepalive_timeout 必须小于 node 侧的 server.keepAliveTimeout(65s)，
    # 否则 node 先关连接、nginx 正好复用它，用户随机吃到 502。
    keepalive 16;
    keepalive_timeout 60s;
}

server {
    listen 11451;
    listen [::]:11451;
    server_name _;

    server_tokens off;

    # 隧道来的请求在 nginx 眼里都来自 127.0.0.1，先把真实来源还原出来，
    # 否则下面所有基于 $binary_remote_addr 的限流会把全公网算成同一个人。
    # 必须在 limit_req/limit_conn 生效前 include（realip 在 POST_READ 阶段执行）。
    include /etc/nginx/snippets/school-wall-realip.conf;

    # ---- 请求体上限 ----
    # 后端给上传接口放到 5MB（base64 后约 2.7MB 的图片），其余接口 128KB。
    # 这里按最宽的接口设一个总闸：超过的连接在代理层就被拒，不进 node，
    # 也就不会触发一次同步的 JSON.parse。
    client_max_body_size 6m;
    client_body_buffer_size 128k;

    # ---- 慢速连接（slowloris）----
    # 这是把 node 挡在后面的主要理由之一：慢慢发请求头的连接在这里就被掐断。
    client_header_timeout 10s;
    client_body_timeout   20s;
    send_timeout          30s;
    keepalive_timeout     30s;

    # 单 IP 并发连接上限。校园网常常整栋楼共用一个出口 IP，
    # 这个值不能太小 —— 太小的话正常用户会互相挤掉。
    limit_conn sw_conn 30;
    limit_req_status  429;
    limit_conn_status 429;

    access_log /var/log/nginx/school-wall.access.log;
    error_log  /var/log/nginx/school-wall.error.log warn;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    root /home/server/school_wall/client/dist;
    index index.html;

    # ---- API ----
    location /api/ {
        limit_req zone=sw_read  burst=60 nodelay;
        limit_req zone=sw_write burst=10 nodelay;

        proxy_pass http://school_wall_backend;
        include /etc/nginx/snippets/school-wall-proxy.conf;
        include /etc/nginx/snippets/school-wall-headers.conf;
    }

    # ---- 管理后台 ----
    location /dashboard {
        limit_req zone=sw_read burst=20 nodelay;
        proxy_pass http://school_wall_backend;
        include /etc/nginx/snippets/school-wall-proxy.conf;
        include /etc/nginx/snippets/school-wall-headers.conf;
    }

    # ---- 用户上传的图片 ----
    # 直接由 nginx 发（sendfile），不经过 node 的事件循环。
    # 这些文件本来就没有访问控制，交给 nginx 不会放宽任何权限。
    location /uploads/ {
        alias /home/server/school_wall/server/uploads/;
        try_files $uri =404;

        include /etc/nginx/snippets/school-wall-headers.conf;
        # 只用 add_header 设缓存。expires 指令自己也会发一条 Cache-Control，
        # 两者并存的话响应里会出现两条。
        add_header Cache-Control "public, max-age=604800" always;
        # 上传目录里只应该有图片。万一混进 .html/.svg 被当成页面渲染，
        # 就成了同源的存储型 XSS —— 这两个头把这条路堵死。
        add_header Content-Disposition "inline" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; sandbox" always;
    }

    # ---- 带 hash 的构建产物 ----
    location /assets/ {
        try_files $uri =404;
        include /etc/nginx/snippets/school-wall-headers.conf;
        include /etc/nginx/snippets/school-wall-csp.conf;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
    }

    # ---- SPA 前端路由 ----
    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/snippets/school-wall-headers.conf;
        include /etc/nginx/snippets/school-wall-csp.conf;
    }

    # index.html 不能缓存，否则前端发版后老用户会一直拿到旧的资源引用。
    # 注意 location / 的 try_files 回落到 /index.html 时会内部重入这里，
    # 所以安全头必须在这个 location 里也发一遍。
    location = /index.html {
        include /etc/nginx/snippets/school-wall-headers.conf;
        include /etc/nginx/snippets/school-wall-csp.conf;
        add_header Cache-Control "no-cache" always;
    }

    # 隐藏文件、备份文件一律不给
    location ~ /\. { deny all; }
    location ~ ~$  { deny all; }
}
