# 校园墙部署机 —— sshd 加固
# 安装到 /etc/ssh/sshd_config.d/99-school-wall-hardening.conf
# （Debian 的 /etc/ssh/sshd_config 顶部有 Include sshd_config.d/*.conf，
#   且 sshd 取的是「第一次出现的值」，所以这个文件必须在包含列表里排在主配置的
#   同名指令之前 —— 99- 前缀在 Include 段里是按字典序读的，主配置里的默认值
#   都写在 Include 之后，因此这里的设置会生效。）

# root 完全不允许 SSH 登录。日常操作走 server 用户 + sudo，
# 出问题时还能从 VirtualBox 控制台进本地 root。
PermitRootLogin no

# 只允许这一个账号登录
AllowUsers server

# 单次连接最多试 3 次认证，配合 fail2ban 缩短暴力破解的窗口
MaxAuthTries 3

# 认证阶段的超时。默认 120 秒意味着攻击者可以只建连接不认证，
# 白占 sshd 的 MaxStartups 名额 120 秒。
LoginGraceTime 30

# 未认证连接的并发上限：超过 10 条开始按 30% 概率拒绝，到 60 条全拒
MaxStartups 10:30:60
MaxSessions 5

# 用不到的功能一律关掉
X11Forwarding no
AllowAgentForwarding no
PermitUserEnvironment no
PermitTunnel no

# 空闲 10 分钟（300s × 2）自动断开，避免忘了退出的会话一直挂着
ClientAliveInterval 300
ClientAliveCountMax 2

# 端口转发保留开启：`ssh -L` 是从外面调试回环上服务的常用手段，
# 而后端现在只监听 127.0.0.1，关掉会让排障变麻烦。
# 如果这台机器以后要给不完全信任的人登录，把下面一行改成 no。
AllowTcpForwarding yes
